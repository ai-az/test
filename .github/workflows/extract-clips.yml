name: Build TikTok clips

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tiktok-video-clips-extraction-l9um55
    paths:
      - .github/workflows/extract-clips.yml
      - scripts/tiktok/**
      - .work/trigger.txt

permissions:
  contents: read

env:
  VIDEO_URL: "https://youtu.be/nSH6Hpw8Dpg"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system + python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0
          python -m pip install -q -U "yt-dlp[default]" yt-dlp-ejs bgutil-ytdlp-pot-provider \
            Pillow uharfbuzz "fonttools[woff]"
          node --version
          yt-dlp --version

      - name: Start PO token provider
        run: |
          git clone --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          cd /tmp/bgutil/server
          npm install --silent
          npx tsc
          nohup node build/main.js > /tmp/pot.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:4416/ping && break || sleep 2
          done
          echo

      - name: Fetch Thmanyah font
        working-directory: scripts/tiktok
        run: python fetch_thmanyah.py   # transient, not committed

      - name: Download clip windows (HLS bypasses SABR)
        working-directory: scripts/tiktok
        run: |
          set +e
          COMMON="--js-runtimes node --sleep-requests 2 -N 4 \
                  --extractor-args youtube:player_client=web_safari;webpo_bind=never"
          declare -A SEC=(
            [clip1_alrazi]="*1318-1483"
            [clip2_taslim]="*1528-1605"
            [clip3_abubakr]="*1987-2131"
            [clip4_alghar]="*2381-2483"
            [clip5_musa]="*2488-2666"
          )
          mkdir -p raw
          for round in $(seq 1 25); do
            echo "===== ROUND $round"
            allok=1
            for name in clip1_alrazi clip2_taslim clip3_abubakr clip4_alghar clip5_musa; do
              out="raw/${name}.mp4"
              if [ -f "$out" ] && [ "$(stat -c%s "$out")" -gt 400000 ]; then continue; fi
              yt-dlp --js-runtimes node --sleep-requests 2 -N 4 \
                --extractor-args "youtube:player_client=web_safari;webpo_bind=never" \
                -f 94/93 --download-sections "${SEC[$name]}" --force-keyframes-at-cuts \
                -o "raw/${name}.%(ext)s" "$VIDEO_URL" 2>&1 | tail -1
              [ -f "$out" ] && [ "$(stat -c%s "$out")" -gt 400000 ] || { allok=0; sleep 20; }
            done
            [ "$allok" = "1" ] && break
            sleep 30
          done
          set -e
          ls -la raw/
          # fail loudly if nothing downloaded
          test -n "$(ls -A raw/*.mp4 2>/dev/null)"

      - name: Render final clips
        working-directory: scripts/tiktok
        run: |
          cp captions.ar.srt video.ar.srt
          python build_final.py
          ls -la clips/

      - name: Upload clips
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-clips
          path: scripts/tiktok/clips/*.mp4
          if-no-files-found: error
          retention-days: 7
